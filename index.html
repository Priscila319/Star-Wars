<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Luck</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
     
        <div class="imagem">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9KK8rxgTZrKLsHj6HEat628ghHsRhSeXs9A&s" alt="Star Wars Poster"/>
        </div>
    

        <h2>Star Wars</h2>
        <hr/>
        
        <p class="titulo">Clique no botão para sorteio</p>
        <button onclick="getPersonagem()">Sortear</button>
        
        <card>
        <div class="info-box">
            <p><strong>Nome do personagem:</strong></p>
            <div id="nome-personagem">...</div> 
        </div>
        </card>

        <hr/>
        
        <card>
        <div class="info-box">
            <p><strong>Nome do gênero:</strong></p>
            <div id="genero-personagem">...</div>
        </div>
        </card>

        <hr/>

        <card>
        <div class="info-box">
            <p><strong>Cor dos olhos</strong></p>
            <div id="cor-olhos">...</div>
        </div>
    </div>
</card>

    <script src="script.js"></script>
</body>
</html>
